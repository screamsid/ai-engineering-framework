# Routing precedence rules
#
# 1. Task-type rules define primary role and preferred agent.
# 2. Risk-level rules add governance requirements.
# 3. Governance rules accumulate rather than replace.
# 4. Critical-risk rules override autonomy assumptions.
# 5. Human validation requirements take precedence over all autonomous approval paths.
# 6. Routing remains deterministic-first unless future AI-assisted routing is explicitly enabled.
#
# This explicit precedence model avoids hidden routing behaviour and reduces ambiguity.

routing_rules:
  - match:
      task_type: python-automation
    assign:
      role: builder
      preferred_agent: codex

  - match:
      task_type: infra-automation
    assign:
      role: builder
      preferred_agent: codex

  - match:
      task_type: framework-design
    assign:
      role: reviewer
      preferred_agent: claude-code

  - match:
      risk_level: high
    assign:
      reviewer_required: true
      security_review_required: true

  - match:
      risk_level: critical
    assign:
      human_validation_required: true
